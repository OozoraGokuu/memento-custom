name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string
      publish:
        description: Publish automatically after all package checks pass
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -q "VERSION ${RELEASE_TAG#v}$" CMakeLists.txt
          grep -q "^# Memento Custom ${RELEASE_TAG#v}$" RELEASE_NOTES.md
  build:
    needs: validate
    uses: ./.github/workflows/build.yml
  macos:
    needs: validate
    uses: ./.github/workflows/macos.yml
  release:
    needs: [build, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: '*-package*'
          merge-multiple: true
          path: assets
      - name: Create release from validated packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test -s assets/Memento_Windows_x86_64.zip
          test -s assets/Memento_Windows_x86_64_Installer.exe
          test -s assets/Memento_Linux_x86_64.flatpak
          test -s assets/Memento_macOS_arm64.zip
          test -s assets/Memento_macOS_x86_64.zip
          (cd assets && sha256sum Memento* install-memento.sh > SHA256SUMS.txt)
          release_options=(--draft)
          if [[ "${{ inputs.publish }}" == "true" ]]; then release_options=(--latest); fi
          gh release create "$RELEASE_TAG" assets/* "${release_options[@]}" --target "$GITHUB_SHA" --title "Memento Custom ${RELEASE_TAG#v}" --notes-file RELEASE_NOTES.md
